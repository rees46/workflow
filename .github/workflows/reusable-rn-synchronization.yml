name: Sync Repositories

"on":
  workflow_call:
    inputs:
      node-version:
        description: >-
          Node version to run this workflow. Default: 18 as it is in action
          cache
        default: '18'
        required: false
        type: string
      changeLookUpPath:
        description: 'Specify the folder to look for changes and publish'
        required: true
        type: string
      targetRepository:
        description: Repository to sync into, as owner/name
        required: true
        type: string
      appId:
        description: >-
          GitHub App that pushes to the target repository and merges its
          pull request
        required: true
        type: string
      reviewerUsername:
        description: Reviewer and assignee of the mirror pull request
        default: Xyzcancer
        required: false
        type: string
    secrets:
      appSecret:
        required: true

jobs:
  run:
    name: Synchronization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Split the target repository into owner and name
        id: target
        env:
          TARGET_REPOSITORY: ${{ inputs.targetRepository }}
        run: |
          echo "owner=${TARGET_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      # Before anything else, so an app without access to the target fails
      # the run on every release, not only on one that has changes.
      - uses: actions/create-github-app-token@v1
        id: appToken
        with:
          app-id: ${{ inputs.appId }}
          private-key: ${{ secrets.appSecret }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - id: changed_files
        uses: tj-actions/changed-files@v42

      # grep -c prints 0 but exits 1 when nothing matches; under bash -e that
      # failed the run for every release without changes in the path.
      - name: Determine if changes are in the specified path
        run: |
          path_changes_count="$(printf '%s' \
            '${{ steps.changed_files.outputs.all_changed_files }}' | \
            grep -F -c '${{ inputs.changeLookUpPath }}' || true)"
          echo "path_changes=$path_changes_count" >> "$GITHUB_ENV"

      - name: Check out remote repository if changes
        if: env.path_changes != '0'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.targetRepository }}
          token: ${{ steps.appToken.outputs.token }}
          path: repo2

      - name: Sync files to remote repository if changes
        if: env.path_changes != '0'
        run: |
          rsync -av --progress \
            ${{ inputs.changeLookUpPath }}/ repo2/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'README.md' \

      - name: Apply changes to package.json
        if: env.path_changes != '0'
        working-directory: repo2
        run: |
          find . -type f -name 'package.json' -exec sed -i \
            -e 's|rees46/react-native|personaclick/rn|g' \
            -e 's|Rees46/react-native|PersonaClick/rn|g' \
            -e 's/REES46/PersonaClick/g' \
            -e 's/Rees46/PersonaClick/g' {} +

      - name: Apply changes to JavaScript and TypeScript files
        if: env.path_changes != '0'
        working-directory: repo2
        run: |
          find . -type f \( \
            -name '*.js' -o \
            -name '*.ts' -o \
            -name '*.tsx' -o \
            -name '*.d.ts' \
          \) -exec sed -i \
            -e 's|https://api.rees46.ru/|https://api.personaclick.com/|g' \
            -e 's/REES46/PersonaClick/g' \
            -e 's/Rees46/PersonaClick/g' \
            -e 's/rees46/personaClick/g' {} +

      - name: Apply changes to YAML files
        if: env.path_changes != '0'
        working-directory: repo2
        run: |
          find . -type f \( -name '*.yml' -o -name '*.yaml' \) -exec sed -i \
            -e 's/REES46/PersonaClick/g' \
            -e 's/Rees46/PersonaClick/g' \
            -e 's/rees46/personaclick/g' {} +

      - name: Apply changes to CHANGELOG.md
        if: env.path_changes != '0'
        working-directory: repo2
        run: |
          find . -type f -name 'CHANGELOG.md' -exec sed -i \
            -e 's|\[\([^]]*\)\]\(([^)]*)\)|\1|g' \
            -e 's/REES46/PersonaClick/g' \
            -e 's/Rees46/PersonaClick/g' \
            -e 's/rees46/personaclick/g' {} +

      # The source keeps one lockfile for the whole monorepo, the target has
      # its own. Without this a new dependency leaves the target's lockfile
      # behind and its `yarn install --immutable` check fails. The yarn the
      # target pins in .yarnrc.yml does the work; its install state is not
      # part of the release.
      - name: Bring the target lockfile in line with package.json
        if: env.path_changes != '0'
        working-directory: repo2
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          yarn install --mode=update-lockfile
          git checkout -- .yarn/install-state.gz 2>/dev/null || true

      - name: Validate PersonaClick rewrites
        if: env.path_changes != '0'
        working-directory: repo2
        run: |
          if grep -RInE 'REES46|Rees46|rees46' . --exclude-dir='.git'; then
            echo "Found unconverted REES46 references in synced repository"
            exit 1
          fi

      - name: Set branch name
        if: env.path_changes != '0'
        run: |
          echo "BRANCH_NAME=feat/new-release-$(date +%Y%m%d%H%M%S)" \
            >> "$GITHUB_ENV"

      # The shared sync action: commits as the app, opens the pull request
      # and merges it at once.
      - name: Open and merge the target pull request
        if: env.path_changes != '0'
        uses: rees46/workflow/.github/actions/github/pull-request/create@master
        with:
          targetDirectory: repo2
          githubToken: ${{ steps.appToken.outputs.token }}
          targetRepository: ${{ inputs.targetRepository }}
          branchName: ${{ env.BRANCH_NAME }}
          commitMessage: 'feat: release'
          prTitle: Automated release
          prBody: >-
            This is an automated pull request to update from branch
            ${{ env.BRANCH_NAME }}
          reviewerUsername: ${{ inputs.reviewerUsername }}
          lastPrAuthor: ${{ inputs.reviewerUsername }}
