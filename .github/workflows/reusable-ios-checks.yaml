# yamllint disable rule:line-length
name: iOS checks

on:
  workflow_call:
    inputs:
      googleServicesFileLocation:
        required: false
        type: string
        default: './DemoApp/REES46Demo/Supporting Files/'
      googleServicesFileName:
        required: false
        type: string
        default: GoogleService-Info.plist

    secrets:
      googleServicesString:
        description: Google services file as base64 string
        required: true
      # No longer used: the CocoaPods lint steps are gone. Optional until the
      # callers stop passing it, then it goes too.
      cocoapodsToken:
        description: Cocoapods token
        required: false
      env_vars:
        required: false

jobs:
  run:
    runs-on: macos-latest
    env:
      ACTIONS_IS_RUNNING: true
      env_vars: ${{ secrets.env_vars }}
    steps:
      - run: |
          echo "$env_vars"
          for i in $env_vars; do
            # shellcheck disable=SC2001,SC2086
            i=$(echo $i | sed 's/=.*//g')=$(echo ${i#*=} | base64 -d | base64 -d)
            # shellcheck disable=SC2086
            echo ::add-mask::${i#*=}
            # shellcheck disable=SC2086
            printf '%s\n' "$i" >> $GITHUB_ENV
          done
          env

      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2

      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install
        working-directory: ./DemoApp
        run: |
          pod install

      - name: Decode signing key file
        uses: timheuer/base64-to-file@v1.2
        id: service_account_json_file
        with:
          fileName: ${{ inputs.googleServicesFileName }}
          fileDir: ${{ inputs.googleServicesFileLocation }}
          encodedString: ${{ secrets.googleServicesString }}

      - name: Copy Google Service
        run: |
          cp ./DemoApp/REES46Demo/Supporting\ Files/GoogleService-Info.plist ./DemoApp/GoogleService-Info.plist
          cp ./DemoApp/REES46Demo/Supporting\ Files/GoogleService-Info.plist ./DemoApp/REES46.xcodeproj/xcshareddata/xcschemes/GoogleService-Info.plist
          cp ./DemoApp/REES46Demo/Supporting\ Files/GoogleService-Info.plist ./DemoApp/REES46Demo/GoogleService-Info.plist

      - name: Select simulator
        id: sim
        run: |
          # macos-latest floats: a runner Xcode bump can drop or rename a device (e.g. Xcode 26.5
          # removed "iPhone 16"), which breaks a pinned name=... destination. Pick whatever iPhone
          # simulator is available and target it by UDID so the build survives those changes.
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-Fa-f-]{36}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"; exit 1
          fi
          echo "Selected simulator:"; xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build -workspace ./DemoApp/REES46.xcworkspace -scheme REES46Demo \
          -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
          CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED='NO' CODE_SIGN_ENTITLEMENTS=''

      - name: Boot the simulator and let it settle
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          # A simulator booted for the first time spends minutes compiling shaders and drawing the lock
          # screen's posters, and on the runner's three cores that leaves no CPU time to the utility-QoS
          # queues the SDK's core runs on: tests that wait for them time out. Tests start once the first-boot
          # work has calmed down (the mean idle CPU of the last five samples is 25 % or more), three minutes
          # at most; the step never fails on its own.
          start=$(date +%s)
          last=""
          while [ $(( $(date +%s) - start )) -lt 180 ]; do
            idle=$(top -l 2 -s 1 -n 0 | awk '/CPU usage/ { v = $7 } END { sub("%", "", v); print int(v) }')
            echo "$(date +%T) idle ${idle}%"
            last=$(echo "$last $idle" | awk '{ for (i = (NF > 5 ? NF - 4 : 1); i <= NF; i++) printf "%s ", $i }')
            mean=$(echo "$last" | awk '{ s = 0; for (i = 1; i <= NF; i++) s += $i; print (NF == 5 ? int(s / 5) : 0) }')
            if [ "$mean" -ge 25 ]; then break; fi
          done
          echo "The simulator settled for $(( $(date +%s) - start )) s"

      - name: Run tests
        if: ${{ !cancelled() }}
        run: |
          xcodebuild test -workspace ./DemoApp/REES46.xcworkspace -scheme REES46Demo \
          -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
          CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED='NO' CODE_SIGN_ENTITLEMENTS=''
